name: Docker Image CI
on:
  #push:
    #branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    name: Build PHP ${{ matrix.php_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php_version: '8.2.35'
            php_series: '8.2'
            dockerfile: Dockerfile
          - php_version: '7.3.33'
            php_series: '7.3'
            dockerfile: Dockerfile.php73
    env:
      PHP_VERSION: ${{ matrix.php_version }}
      PHP_SERIES: ${{ matrix.php_series }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      NGINX_VERSION: '1.30.7'
      IMAGE_NAME: ${{ secrets.DOCKER_USER }}/docker-nginx-oracle-php-fpm
    
    steps:
    - uses: actions/checkout@v2
    - name: docker login
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER}}
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run:
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        
    - name: Build the Docker image
      run: |
        docker build --pull --platform linux/amd64 . --file "$DOCKERFILE" --tag "$IMAGE_NAME:$PHP_VERSION" --tag "$IMAGE_NAME:$PHP_SERIES"

    - name: Smoke test NGINX and PHP-FPM
      run: |
        docker run -d --name php-smoke "$IMAGE_NAME:$PHP_VERSION"
        trap 'docker rm -f php-smoke' EXIT
        docker exec php-smoke nginx -t
        docker exec php-smoke php-fpm -t
        docker exec php-smoke php -r 'exit(extension_loaded("oci8") ? 0 : 1);'
        nginx_version="$(docker exec php-smoke nginx -v 2>&1)"
        printf '%s\n' "$nginx_version"
        test "$nginx_version" = "nginx version: nginx/$NGINX_VERSION"
        docker exec php-smoke sh -c 'printf "<?php echo PHP_VERSION;" > /var/www/html/__ci_php_smoke.php'
        for attempt in $(seq 1 30); do
          if docker exec php-smoke curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1/__ci_php_smoke.php > "$RUNNER_TEMP/php-version.txt"; then
            test "$(cat "$RUNNER_TEMP/php-version.txt")" = "$PHP_VERSION"
            exit 0
          fi
          sleep 1
        done
        docker logs php-smoke
        exit 1
     
    - name: Docker Push
      run: |
        docker push "$IMAGE_NAME:$PHP_VERSION"
        docker push "$IMAGE_NAME:$PHP_SERIES"

    - name: Publish latest (PHP 8.2 only)
      if: matrix.php_series == '8.2'
      run: |
        docker tag "$IMAGE_NAME:$PHP_VERSION" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
